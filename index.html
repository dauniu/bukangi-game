<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부캉이 수학 탈출</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="app">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="levelBanner" class="level-banner hidden"></div>

    <button id="rankBtn" class="chip-btn">🏆 순위</button>

    <div id="helpText">↑ ↓ 또는 W/S · 모바일은 화면 위/아래 터치</div>

    <div id="setup" class="overlay">
      <div class="card">
        <h1>부캉이 수학 탈출</h1>
        <p class="sub">물고기는 먹고, 생닭·쓰레기는 피하고, 그물에 걸리면 수학 퀴즈로 탈출!</p>

        <label class="field-label" for="playerName">이름 또는 닉네임</label>
        <input id="playerName" type="text" maxlength="10" value="부캉이친구" />

        <div class="level-grid">
          <button class="level-btn selected" data-level="easy">
            <strong>초급</strong>
            <span>20 미만 덧셈·뺄셈</span>
          </button>
          <button class="level-btn" data-level="medium">
            <strong>중급</strong>
            <span>50 미만 덧셈·뺄셈 + 기본 곱셈·나눗셈</span>
          </button>
          <button class="level-btn" data-level="hard">
            <strong>고급</strong>
            <span>100 미만 덧셈·뺄셈 + 두 자리 수 × 한 자리 수 / 나눗셈</span>
          </button>
        </div>

        <div class="button-row">
          <button id="startBtn" class="main-btn">게임 시작</button>
          <button id="openRankBtn" class="sub-btn">순위 보기</button>
        </div>
      </div>
    </div>

    <div id="leaderboard" class="overlay hidden">
      <div class="card">
        <h2>🏆 부캉이 명예의 전당</h2>
       <p class="sub">오늘의 온라인 최고 점수 TOP 10</p>
        <ol id="rankList"></ol>
        <button id="closeRankBtn" class="main-btn">닫기</button>
      </div>
    </div>

    <div id="quiz" class="overlay hidden">
      <div class="card quiz-card">
        <div class="quiz-badge">🥅 그물 탈출 퀴즈</div>
        <div id="quizQuestion" class="quiz-question">7 + 5 = ?</div>
        <div id="quizOptions" class="quiz-options"></div>
        <div id="quizMsg" class="quiz-msg"></div>
        <div id="quizHint" class="quiz-hint"></div>
      </div>
    </div>
  </div>

 <script type="module" src="./game.js"></script>

    MIT License
  </a>
</footer>
  
</body>
</html>
